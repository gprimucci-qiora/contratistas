<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avance Contratistas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--qg:#3f873f;--qg-lt:#ecf4ec;--qg-md:#c6dfc6;--ink:#111;--g7:#3d3d3d;--g5:#6e6e6e;--g4:#9a9a9a;--g2:#e6e6e6;--g1:#f4f4f4;--bg:#f6f6f4;--red:#d93025;--red-lt:#fdecea;--amb:#e8a317;--amb-dk:#b37800;--amb-lt:#fff6e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px 48px}
button{font:inherit;cursor:pointer}
/* loader */
#drop{display:block;margin:90px auto;max-width:620px;background:#fff;border:3px dashed var(--g2);border-radius:20px;padding:56px 30px;text-align:center;cursor:pointer}
#drop.over{border-color:var(--qg);background:var(--qg-lt)}
#drop img{display:block;height:36px;margin:0 auto 26px}
#drop b{display:block;font-size:21px;margin-bottom:6px}#drop span{color:var(--g5);font-size:14px}
#status{margin-top:16px;font-size:14px;color:var(--qg);font-weight:600}
/* top bar */
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--g2)}
.nav-in{max-width:1240px;margin:0 auto;padding:12px 32px;display:flex;gap:10px;align-items:center}
.nav img{height:26px;margin-right:14px}
.nav .btn{border:1px solid var(--g2);background:#fff;border-radius:10px;padding:8px 13px;font-weight:700}
.nav .btn:hover{border-color:var(--g4)}
.nav select{border:1px solid var(--g2);background:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-weight:700}
.nav #sel{min-width:360px}
.nav .sp{flex:1}
.nav .info{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:700}
.warnbar{max-width:1240px;margin:0 auto;padding:8px 32px 0;font-size:13px;color:var(--amb-dk)}
/* header */
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:28px 0 18px;border-bottom:3px solid var(--ink)}
.hd .n{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hd .d{font-size:15px;color:var(--g5)}
.hd .r{text-align:right;font-size:14px;color:var(--g5)}.hd .r b{color:var(--ink)}
/* grid */
.top{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:18px;margin-top:22px}
.sec-t{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--g5);margin-bottom:10px}
.box{background:#fff;border-radius:16px;padding:22px 24px;border:1px solid var(--g2);height:100%}
.money{background:var(--ink);color:#fff;border:none;display:flex;flex-direction:column;justify-content:center}
.money .l{font-size:16px;color:#cfcfcf}
.money .v{font-size:50px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:6px 0 12px}
.money sup{font-size:22px;color:#cfcfcf;margin-left:2px}
.money .s{font-size:15px;color:#cfcfcf}.money .s b{color:#fff}
.money .ast{font-size:12px;color:#9a9a9a;margin-top:12px}
.early{margin-top:10px;font-size:13px;color:#f3c77a}
.price-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px}
.price-top .l{font-size:15px;color:var(--g7);font-weight:600}
.price-top .v{font-size:36px;font-weight:800;color:var(--qg)}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--g2)}
.ic{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.ic.ok{background:var(--qg-lt);color:var(--qg)}.ic.bad{background:var(--red-lt);color:var(--red)}
.line .tx{flex:1}.line .tx b{display:block;font-size:15px}.line .tx span{font-size:13px;color:var(--g5)}.line .tx span strong{color:var(--ink)}
.chip{font-size:18px;font-weight:800;white-space:nowrap}.chip.up{color:var(--qg)}.chip.dn{color:var(--red)}.chip.z{color:var(--g4)}
.sum{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:11px 14px;border-radius:12px;background:var(--g1);font-size:14px;color:var(--g7)}
.sum b{font-size:18px;color:var(--ink)}
.how{font-size:12px;color:var(--g4);margin-top:8px}
.act{display:flex;align-items:center;gap:14px;padding:14px 0}.act+.act{border-top:1px solid var(--g2)}
.act .num{width:30px;height:30px;border-radius:50%;background:var(--qg);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act .tx{flex:1}.act .tx b{display:block;font-size:15px}.act .tx span{font-size:13px;color:var(--g5)}
.act .gain{font-size:20px;font-weight:800;color:var(--qg);white-space:nowrap}
.none{color:var(--g5);font-size:14px;padding:12px 0}
/* tecnicos */
.tecs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px;align-items:start}
.grp{border-radius:16px;padding:16px;border:2px solid}
.grp.r{background:var(--red-lt);border-color:#f3c3be}.grp.a{background:var(--amb-lt);border-color:#f5dd9e}.grp.g{background:var(--qg-lt);border-color:var(--qg-md)}
.gh{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.gh .cnt{margin-left:auto;font-size:15px}
.dot{width:13px;height:13px;border-radius:50%}.r .dot{background:var(--red)}.a .dot{background:var(--amb)}.g .dot{background:var(--qg)}
.gs{font-size:13px;color:var(--g7);margin:4px 0 12px}
.p{background:#fff;border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px solid transparent;text-align:left}
.p+.p{margin-top:8px}
button.p:hover{border-color:var(--g4)}
.p .nm{font-weight:700;font-size:14px}.p .ms{font-size:12px;color:var(--g5)}.p .ms strong{color:var(--ink)}
.days{text-align:right;white-space:nowrap}.days b{font-size:20px;font-weight:800}.days span{display:block;font-size:11px;color:var(--g5)}
.r .days b{color:var(--red)}.a .days b{color:var(--amb-dk)}.g .days b{color:var(--qg)}
.hint{font-size:12px;color:var(--g4);margin-top:10px;text-align:right}
footer{margin-top:30px;font-size:12px;color:var(--g4);text-align:center}
.err{background:var(--red-lt);color:var(--red);border-radius:12px;padding:14px;margin-top:20px;font-weight:600}
/* modal */
.mo{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 20px}
.mo.open{display:flex}
.mc{background:#fff;border-radius:18px;max-width:880px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 26px;border-bottom:1px solid var(--g2)}
.mh .t{font-size:22px;font-weight:800}.mh .st{font-size:14px;color:var(--g5)}
.x{border:none;background:var(--g1);width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:700}
.mb{padding:22px 26px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.k{background:var(--g1);border-radius:12px;padding:12px 14px}
.k .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g5)}
.k .v{font-size:24px;font-weight:800;margin-top:2px}.k .s{font-size:12px;color:var(--g5)}
.k.good .v{color:var(--qg)}.k.bad .v{color:var(--red)}.k.mid .v{color:var(--amb-dk)}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:24px}
.h4{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--g5);margin-bottom:10px}
table.tt{width:100%;border-collapse:collapse;font-size:14px}
table.tt td{padding:8px 4px;border-bottom:1px solid var(--g2)}
table.tt td.r{text-align:right;font-weight:700}
table.tt tr.tot td{border-bottom:none;border-top:2px solid var(--ink);font-weight:800}
.bar{height:6px;background:var(--g1);border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;background:var(--qg);border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;font-weight:700;color:var(--g4);text-align:center}
.cal .c{aspect-ratio:1.1;border-radius:8px;background:var(--g1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--g4)}
.cal .c b{font-size:16px;color:var(--ink)}
.cal .c.f0{background:var(--red-lt)}.cal .c.f0 b{color:var(--red)}
.cal .c.f1{background:#fbeccf}.cal .c.f2{background:var(--qg-md)}.cal .c.f3{background:var(--qg)}.cal .c.f3 b,.cal .c.f3{color:#fff}
.cal .c.sun{background:transparent;border:1px dashed var(--g2)}
.cal .c.fut{background:transparent;border:1px dashed var(--g2)}
.cal .c.fest{outline:2px solid var(--amb)}
.cal .c.empty{background:transparent}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--g5);margin-top:10px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.note{margin-top:20px;padding:14px 16px;border-radius:12px;font-size:14px}
.note.r{background:var(--red-lt)}.note.a{background:var(--amb-lt)}.note.g{background:var(--qg-lt)}
/* reglas */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rc{background:var(--g1);border-radius:14px;padding:16px 18px}
.rc b.h{display:block;font-size:15px;margin-bottom:6px}
.rc p,.rc li{font-size:14px;color:var(--g7)}.rc ul{padding-left:18px}
.formula{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin:6px 0}
.formula span{font-size:11px;font-weight:600;color:var(--g5);display:block}
.formula div{text-align:center}
table.pt{width:100%;border-collapse:separate;border-spacing:4px;font-size:13px;margin-top:8px}
table.pt th{background:var(--ink);color:#fff;padding:6px;border-radius:6px;font-weight:700}
table.pt td{text-align:center;padding:7px;border-radius:6px;background:#fff;font-weight:700}
table.pt td:first-child{background:transparent;text-align:left;color:var(--g5);font-weight:600}
table.pt td.lo{background:var(--red-lt);color:var(--red)}table.pt td.b1{background:var(--qg-md)}table.pt td.b2{background:var(--qg);color:#fff}
table.pt td.me{outline:3px solid var(--amb)}
.tabs{display:flex;gap:6px;margin:4px 0 4px}
.tabs button{border:1px solid var(--g2);background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== WEB LAYOUT v2 ===== */
[hidden]{display:none!important}
body{background:#f3f3f1}
#app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--g2);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .lg{padding:22px 22px 16px;border-bottom:1px solid var(--g2)}
.side .lg img{height:28px;display:block}
.side .lg .sub{font-size:12px;color:var(--g5);margin-top:6px;font-weight:600}
.side .mes{padding:14px 22px;border-bottom:1px solid var(--g2)}
.side .mes label{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--g4);display:block;margin-bottom:6px}
.side .mes select{width:100%;border:1px solid var(--g2);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;background:#fff}
.side .lst{flex:1;overflow:auto;padding:10px}
.side .lst .ttl{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--g4);padding:6px 12px}
.ci{display:block;width:100%;text-align:left;border:none;background:transparent;border-radius:12px;padding:11px 12px;margin-bottom:2px}
.ci:hover{background:var(--g1)}
.ci.on{background:var(--ink);color:#fff}
.ci .cn{font-weight:700;font-size:14px;line-height:1.25}
.ci .cm{display:flex;justify-content:space-between;font-size:12px;color:var(--g5);margin-top:4px}
.ci.on .cm{color:#bdbdbd}
.ci .sem{display:inline-flex;gap:3px;align-items:center}
.ci .sem i{width:8px;height:8px;border-radius:50%;display:inline-block}
.side .ft{padding:14px 22px;border-top:1px solid var(--g2)}
.side .ft button{width:100%;border:none;background:var(--qg);color:#fff;border-radius:10px;padding:10px;font-weight:700}
.side .ft .ch{display:block;text-align:center;font-size:12px;color:var(--g5);margin-top:8px;cursor:pointer;text-decoration:underline}
.main{min-width:0}
.mtop{background:#fff;border-bottom:1px solid var(--g2);padding:22px 36px 0}
.mtop .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.mtop .eyebrow{font-size:13px;color:var(--g5);font-weight:600}
.mtop h1{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-top:2px}
.mtop .meta{text-align:right;font-size:13px;color:var(--g5)}
.mtop .meta b{color:var(--ink)}
.prog{margin-top:8px;width:220px;height:6px;background:var(--g1);border-radius:3px;margin-left:auto}.prog i{display:block;height:100%;background:var(--ink);border-radius:3px}
.kpis{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;margin-top:20px;border-top:1px solid var(--g2)}
.kpi{padding:16px 18px 18px;border-right:1px solid var(--g2)}
.kpi:first-child{padding-left:0}.kpi:last-child{border-right:none}
.kpi .l{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--g5)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.kpi .s{font-size:12px;color:var(--g5);margin-top:2px}
.kpi.hero .v{font-size:36px;color:var(--qg)}
.kpi .v.bad{color:var(--red)}.kpi .v.ok{color:var(--qg)}
.kpi sup{font-size:16px;color:var(--g4)}
.content{padding:26px 36px 40px}
.row2{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}
.panel{background:#fff;border:1px solid var(--g2);border-radius:16px;padding:22px 24px}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.ph .t{font-size:16px;font-weight:800}.ph .s{font-size:13px;color:var(--g5)}
.ph a{font-size:13px;color:var(--qg);font-weight:700;cursor:pointer}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mt{border:1px solid var(--g2);border-radius:14px;padding:16px 18px}
.mt .top{display:flex;justify-content:space-between;align-items:center;margin:0}
.mt .nm{font-size:14px;font-weight:700;color:var(--g7)}
.mt .adj{font-size:20px;font-weight:800}.mt .adj.up{color:var(--qg)}.mt .adj.dn{color:var(--red)}.mt .adj.z{color:var(--g4)}
.mt .big{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
.mt .big span{font-size:14px;color:var(--g5);font-weight:600}
.gauge{position:relative;height:10px;background:var(--g1);border-radius:5px;margin:14px 0 22px}
.gauge .f{position:absolute;left:0;top:0;height:100%;border-radius:5px}
.gauge .f.ok{background:var(--qg)}.gauge .f.bad{background:var(--red)}.gauge .f.mid{background:var(--amb)}
.gauge .today{position:absolute;top:0;height:100%;background:rgba(0,0,0,.18);border-radius:5px 0 0 5px}
.gauge .goal{position:absolute;top:-5px;width:2px;height:20px;background:var(--ink)}
.gauge .goal span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.mt .exp{font-size:13px;color:var(--g5);border-top:1px solid var(--g2);padding-top:10px}
.mt .exp strong{color:var(--ink)}
.eq{display:flex;align-items:center;justify-content:space-between;margin-top:16px;background:var(--g1);border-radius:12px;padding:14px 18px}
.eq .parts{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--g7);font-weight:600}
.eq .parts b{font-size:18px;color:var(--ink)}.eq .parts b.up{color:var(--qg)}.eq .parts b.dn{color:var(--red)}
.eq .res{font-size:13px;color:var(--g5);text-align:right}.eq .res b{display:block;font-size:28px;color:var(--qg);letter-spacing:-.5px}
.acts .act{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--g2)}
.acts .act:first-child{border-top:none;padding-top:0}
.acts .num{width:30px;height:30px;border-radius:50%;background:var(--qg);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acts .tx{flex:1}.acts .tx b{display:block;font-size:15px}.acts .tx span{font-size:13px;color:var(--g5)}
.acts .gain{font-size:22px;font-weight:800;color:var(--qg);white-space:nowrap}
.acts .tot{margin-top:6px;border-top:2px solid var(--ink);padding-top:12px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.acts .tot b{color:var(--qg);font-size:18px}
.tpanel{margin-top:20px;padding:0;overflow:hidden}
.tpanel .ph{padding:20px 24px 0;margin-bottom:12px}
.filters{display:flex;gap:8px;padding:0 24px 14px;border-bottom:1px solid var(--g2)}
.filters button{border:1px solid var(--g2);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.filters button i{width:9px;height:9px;border-radius:50%}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--g4);padding:12px 14px;background:#fafafa;border-bottom:1px solid var(--g2);white-space:nowrap}
table.tb td{padding:12px 14px;border-bottom:1px solid var(--g1);vertical-align:middle}
table.tb tr.cl{cursor:pointer}table.tb tr.cl:hover td{background:#fafaf8}
table.tb th.r,table.tb td.r{text-align:right}table.tb th.c,table.tb td.c{text-align:center}
table.tb tr.grpRow td{background:#fff;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:14px 14px 8px;border-bottom:1px solid var(--g2)}
.tnm{font-weight:700}.tsub{font-size:12px;color:var(--g4)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.r{background:var(--red-lt);color:var(--red)}.pill.a{background:var(--amb-lt);color:var(--amb-dk)}.pill.g{background:var(--qg-lt);color:var(--qg)}
.db{display:flex;align-items:center;gap:10px}
.db .trk{position:relative;width:130px;height:7px;background:var(--g1);border-radius:4px}
.db .trk .h{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.db .trk .p{position:absolute;top:0;height:100%;opacity:.35;border-radius:0 4px 4px 0}
.db .trk .m{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);left:calc(25/26*100%)}
.db .n{font-size:13px;color:var(--g5);white-space:nowrap}.db .n b{color:var(--ink);font-size:14px}
.todo{font-size:13px;color:var(--g7);max-width:260px}
.todo strong{color:var(--ink)}
.vac td{color:var(--g5);font-style:italic}
.foot{margin-top:24px;font-size:12px;color:var(--g4);text-align:center}
/* ===== v3 limpio ===== */
.side .lst .ci .cm{justify-content:flex-start;gap:10px}
.pg{max-width:1120px;margin:0 auto;padding:40px 48px 56px}
.pg-h .ey{font-size:14px;color:var(--g5);font-weight:600}
.pg-h h1{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin:4px 0 8px}
.pg-h .meta{display:flex;gap:22px;font-size:14px;color:var(--g5)}
.pg-h .meta b{color:var(--ink)}.pg-h .meta .bad{color:var(--red)}
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:28px}
.c-money{background:var(--ink);color:#fff;border-radius:20px;padding:32px 36px;display:flex;flex-direction:column;justify-content:space-between}
.c-money .l{font-size:16px;color:#c9c9c9}
.c-money .v{font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1;margin:10px 0 18px}
.c-money .v sup{font-size:24px;color:#9a9a9a;margin-left:2px;vertical-align:top}
.c-money .s{font-size:15px;color:#c9c9c9}.c-money .s b{color:#fff}
.c-money .n{font-size:12px;color:#8a8a8a;margin-top:18px}
.c-money .early{color:#f3c77a;font-size:13px;margin-top:8px}
.c-price{background:#fff;border:1px solid var(--g2);border-radius:20px;padding:26px 28px}
.c-price .top{display:flex;justify-content:space-between;align-items:baseline;margin:0;grid-template-columns:none}
.c-price .l{font-size:15px;font-weight:700;color:var(--g7)}
.c-price .v{font-size:44px;font-weight:800;color:var(--qg);letter-spacing:-1px}
.c-price .nrm{font-size:13px;color:var(--g4);margin-top:-4px}
.why{margin-top:18px}
.why .w{display:grid;grid-template-columns:1fr auto;align-items:center;padding:13px 0;border-top:1px solid var(--g2)}
.why .w .t{font-size:15px;font-weight:700}
.why .w .t span{display:block;font-size:13px;font-weight:500;color:var(--g5)}
.why .w .a{font-size:20px;font-weight:800}
.why .w .a.up{color:var(--qg)}.why .w .a.dn{color:var(--red)}.why .w .a.z{color:var(--g4)}
.why .w .bar{grid-column:1/-1;position:relative;height:6px;background:var(--g1);border-radius:3px;margin-top:9px}
.why .w .bar i{position:absolute;left:0;top:0;height:100%;border-radius:3px}
.why .w .bar u{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink)}
.c-price .lnk{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;color:var(--qg);cursor:pointer}
.blk{margin-top:40px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.blk-h .t{font-size:20px;font-weight:800;letter-spacing:-.3px}
.blk-h .s{font-size:14px;color:var(--g5)}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ac{background:#fff;border:1px solid var(--g2);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column}
.ac .g{font-size:30px;font-weight:800;color:var(--qg);letter-spacing:-.5px}
.ac .g.na{font-size:15px;color:var(--g4);font-weight:700;letter-spacing:0;padding:10px 0 6px}
.ac b{font-size:16px;margin-top:6px}
.ac span{font-size:14px;color:var(--g5);margin-top:4px}
.ac.ok{background:var(--qg-lt);border-color:var(--qg-md)}
.ac.warn{background:var(--amb-lt);border-color:#f5dd9e}.ac.warn .g{color:var(--amb-dk)}
.ac .g{font-size:26px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:#fff;border:1px solid var(--g2);border-radius:18px;overflow:hidden}
.col-h{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--g2)}
.col-h .d{width:11px;height:11px;border-radius:50%}
.col-h .t{font-weight:800;font-size:15px;flex:1}
.col-h .n{font-weight:800;font-size:15px;color:var(--g5)}
.col-s{padding:10px 20px 4px;font-size:13px;color:var(--g5)}
.pr{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border:none;background:#fff;text-align:left;border-top:1px solid var(--g1)}
.pr:first-of-type{border-top:none}
button.pr:hover{background:#fafaf8}
.pr .nm{font-weight:700;font-size:14px}
.pr .ms{font-size:12px;color:var(--g5);margin-top:1px}
.pr .ms strong{color:var(--ink)}
.pr .dd{font-size:20px;font-weight:800;min-width:34px;text-align:right}
.pr .dd small{display:block;font-size:10px;font-weight:600;color:var(--g4);text-transform:uppercase;letter-spacing:.5px}
.col.r .col-h .d{background:var(--red)}.col.r .dd{color:var(--red)}
.col.a .col-h .d{background:var(--amb)}.col.a .dd{color:var(--amb-dk)}
.col.g .col-h .d{background:var(--qg)}.col.g .dd{color:var(--qg)}
.col .emp{padding:18px 20px;font-size:14px;color:var(--g4)}
.pr.vac{background:var(--red-lt)}
.foot{margin-top:40px;font-size:12px;color:var(--g4);text-align:center}

/* ===== responsive (celular) ===== */
@media (max-width:820px){
  body{font-size:15px}
  #app{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .side .lst{max-height:260px}
  .pg{padding:22px 16px 40px}
  .pg-h h1{font-size:25px}
  .pg-h .meta{flex-wrap:wrap;gap:6px 16px;font-size:13px}
  .hero{grid-template-columns:1fr;gap:14px;margin-top:20px}
  .c-money{padding:24px 22px}
  .c-money .v{font-size:44px;margin:8px 0 12px}
  .c-price{padding:22px 20px}
  .c-price .v{font-size:36px}
  .blk{margin-top:30px}
  .blk-h{flex-direction:column;gap:2px}
  .blk-h .t{font-size:18px}
  .acts3,.cols{grid-template-columns:1fr;gap:12px}
  .ac{padding:18px 20px}.ac .g{font-size:26px}
  .xbar .xl{display:none}
  .xbar div{padding:12px 16px}.xbar img{height:24px}.xbar button{padding:8px 11px;font-size:13px}
  .mo{padding:0;align-items:stretch}
  .mc{border-radius:0;min-height:100%}
  .mh{padding:16px 16px;position:sticky;top:0;background:#fff;z-index:2}
  .mh .t{font-size:19px}
  .mb{padding:16px}
  .kp{grid-template-columns:1fr 1fr;gap:8px}
  .k .v{font-size:20px}
  .two{grid-template-columns:1fr;gap:20px}
  .rules{grid-template-columns:1fr}
  .rc[style*="grid-column"]{grid-column:auto!important}
  .formula{font-size:16px;gap:6px;flex-wrap:wrap}
  table.pt{font-size:11px;border-spacing:2px}table.pt td,table.pt th{padding:5px 3px}
  .foot{margin-top:28px}
}

<script id="wsrc" type="text/plain">importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
self.onmessage = function (e) {
  try {
    post('Leyendo archivo…');
    var wb = XLSX.read(e.data, { type: 'array', sheets: ['Cierre Iguala', 'Tecnicos'], cellDates: true, dense: true });
    if (!wb.Sheets['Cierre Iguala'] || !wb.Sheets['Tecnicos']) throw new Error('El archivo no tiene las hojas "Cierre Iguala" y "Tecnicos".');
    post('Leyendo técnicos…');
    var T = XLSX.utils.sheet_to_json(wb.Sheets['Tecnicos'], { header: 1, raw: true });
    var h = T.findIndex(function (r) { return r && r.indexOf('USUARIO FFM') >= 0; });
    var hr = T[h], iU = hr.indexOf('USUARIO FFM'), iS = hr.indexOf('SUCURSAL'), iN = hr.indexOf('NOMBRE DEL TÉCNICO'),
        iC = hr.indexOf('Contratista'), iT = hr.indexOf('Tipo');
    var tec = {};
    for (var i = h + 1; i < T.length; i++) { var r = T[i]; if (!r || !r[iU]) continue;
      tec[r[iU]] = { nombre: r[iN], sucursal: String(r[iS] || ''), contratista: String(r[iC] || ''), tipo: r[iT] }; }
    post('Leyendo cierre…');
    var C = XLSX.utils.sheet_to_json(wb.Sheets['Cierre Iguala'], { header: 1, raw: true });
    var hd = C[0], iF = hd.indexOf('Fecha Termino'), iP = hd.indexOf('Usuario para pago'), iSv = hd.indexOf('Servicio');
    var rows = [], sinTec = {}, months = {};
    for (var j = 1; j < C.length; j++) { var x = C[j]; if (!x) continue; var f = x[iF]; if (!(f instanceof Date)) continue;
      var u = x[iP]; var t = tec[u];
      var d = new Date(f.getTime() + 12 * 3600e3);
      var key = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
      if (!t) { sinTec[u] = (sinTec[u] || 0) + 1; continue; }
      if (String(t.contratista).trim().toUpperCase() === 'INTERNO') continue;
      months[key.slice(0, 7)] = 1;
      rows.push([u, key, x[iSv]]);
    }
    self.postMessage({ ok: true, rows: rows, tec: tec, months: Object.keys(months).sort(), sinTec: sinTec });
  } catch (err) { self.postMessage({ ok: false, error: err.message }); }
};
function post(m) { self.postMessage({ progress: m }); }
</script>

// ===== Exportar HTML individual por contratista (solo sus datos) =====
function slug(s){return titleName(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function exportName(c){return 'Avance_'+slug(c.nombre)+'_'+RES.monthKey+'_al'+c.corte.slice(8,10)+'.html'}
function stripC(c){ // solo lo que la página individual necesita
  var keep=JSON.parse(JSON.stringify(c));
  keep.tecs.forEach(function(t){delete t._i});
  return keep;
}
function buildExport(c){
  var css=document.querySelector('style').textContent;
  var lite='var P='+JSON.stringify(Calc.P)+';var Calc={P:P,FESTIVOS:'+JSON.stringify(Calc.FESTIVOS)+',precioA:'+Calc.precioA.toString()+'};';
  var fns=[esc,fmt,cap,titleName,openMo,closeMo,cur,counts,render,openTec,priceTable,openRules].map(function(f){return f.toString()}).join('\n');
  var data='var MESES='+JSON.stringify(MESES)+';var RES='+JSON.stringify({monthKey:RES.monthKey,corte:RES.corte,contratistas:[stripC(c)]}).replace(/</g,'\\u003c')+';var IDX=0,RT="A";';
  var js=lite+'\n'+data+'\n'+fns+'\nfunction $(id){return document.getElementById(id)}\nfunction sidebar(){}\n'+
    'document.getElementById("mo").onclick=function(e){if(e.target.id==="mo")closeMo()};document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMo()});render();';
  return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>Avance '+esc(titleName(c.nombre))+'</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">'+
    '<style>'+css+'.xbar{background:#fff;border-bottom:1px solid var(--g2)}.xbar div{max-width:1120px;margin:0 auto;padding:16px 48px;display:flex;justify-content:space-between;align-items:center}.xbar img{height:30px}.xbar button{border:none;background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}@media print{.xbar button{display:none}}</style></head><body>'+
    '<div class="xbar"><div><img src="'+LOGO+'" alt="QiORA Conecta"><button onclick="openRules()">ⓘ Reglas<span class=xl> del esquema</span></button></div></div>'+
    '<div id="view"></div><div class="mo" id="mo"><div class="mc" id="mc"></div></div>'+
    '<script>'+js+'<\/script></body></'+'html>';
}
function saveBlob(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function downloadOne(){var c=cur();if(c.error)return alertBox('Este contratista no tiene HC autorizado.');saveBlob(new Blob([buildExport(c)],{type:'text/html'}),exportName(c))}
function downloadAll(){
  var zip=new JSZip(), n=0;
  RES.contratistas.forEach(function(c){if(c.error)return;zip.file(exportName(c),buildExport(c));n++});
  zip.generateAsync({type:'blob'}).then(function(b){saveBlob(b,'Avance_contratistas_'+RES.monthKey+'_al'+RES.corte.slice(8,10)+'.zip')});
}
function alertBox(m){console.warn(m)}


var DATA=null, RES=null, IDX=0;
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function $(id){return document.getElementById(id)}
function fmt(n){return '$'+Math.round(n||0).toLocaleString('en-US')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function titleName(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/(^|[\s\/])(\S)/g,function(m,a,b){return a+b.toUpperCase()})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var drop=$('drop'), file=$('file');
['dragenter','dragover'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(ev){if(ev.dataTransfer.files[0])load(ev.dataTransfer.files[0])});
file.addEventListener('change',function(){if(file.files[0])load(file.files[0])});

function load(f){
  $('status').textContent='Abriendo '+f.name+'… (puede tardar unos segundos)';
  f.arrayBuffer().then(function(buf){
    var w=null;
    try{ w=new Worker(URL.createObjectURL(new Blob([$('wsrc').textContent],{type:'text/javascript'}))); }catch(e){ w=null; }
    if(!w) return mainThread(buf);
    var done=false;
    w.onmessage=function(e){ if(e.data.progress){$('status').textContent=e.data.progress;return}
      done=true; w.terminate(); onParsed(e.data); };
    w.onerror=function(){ if(done)return; done=true; w.terminate(); mainThread(buf); };
    w.postMessage(buf.slice(0));
  });
}
function mainThread(buf){
  $('status').textContent='Leyendo archivo… (la página puede pausarse unos segundos)';
  setTimeout(function(){
    var out=null, self_={postMessage:function(m){if(!m.progress)out=m}};
    try{ new Function('self','importScripts',$('wsrc').textContent)(self_,function(){}); self_.onmessage({data:buf}); }
    catch(err){ out={ok:false,error:err.message}; }
    onParsed(out);
  },50);
}
function onParsed(d){
  if(!d||!d.ok){$('status').innerHTML='<span style="color:var(--red)">'+esc(d?d.error:'Error al leer')+'</span>';return}
  DATA=d;
  var ms=$('mes'); ms.innerHTML='';
  var rng={};DATA.rows.forEach(function(r){var k=r[1].slice(0,7),d=+r[1].slice(8,10);var x=rng[k]||(rng[k]={a:99,b:0});if(d<x.a)x.a=d;if(d>x.b)x.b=d});
  DATA.months.forEach(function(k){var o=document.createElement('option');o.value=k;var x=rng[k]||{a:1,b:1};o.textContent=cap(MESES[+k.slice(5,7)-1])+' '+k.slice(0,4)+(x.a>3?' (incompleto: solo del '+x.a+' al '+x.b+')':'');ms.appendChild(o)});
  ms.value=DATA.months[DATA.months.length-1];
  $('loader').hidden=true;$('app').hidden=false;
  var n=Object.keys(DATA.sinTec).length; if(n)console.warn(n+' técnicos sin fila en Tecnicos');
  run();
}
function run(){RES=Calc.compute(DATA.rows,DATA.tec,$('mes').value);IDX=Math.min(IDX,RES.contratistas.length-1);IDX=Math.max(IDX,0);render()}
$('mes').onchange=run;
$('rulesBtn').onclick=openRules;$('dlOne').onclick=downloadOne;$('dlAll').onclick=downloadAll;
$('chg').onclick=function(){location.reload()};
$('mo').onclick=function(e){if(e.target===$('mo'))closeMo()};
var FILTER='all';
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')return closeMo();
  if(!RES||$('mo').classList.contains('open')||e.target.tagName==='SELECT')return;
  var n=RES.contratistas.length;
  if(e.key==='ArrowDown'){IDX=(IDX+1)%n;render();e.preventDefault()}
  if(e.key==='ArrowUp'){IDX=(IDX-1+n)%n;render();e.preventDefault()}});
function openMo(html){$('mc').innerHTML=html;$('mo').classList.add('open');$('mo').scrollTop=0}
function closeMo(){$('mo').classList.remove('open')}
function cur(){return RES.contratistas[IDX]}
function pick(i){IDX=i;FILTER='all';render()}
function setF(f){FILTER=f;render()}
function counts(c){var g={r:c.vacantes||0,a:0,g:0};(c.tecs||[]).forEach(function(t){if(t.grupo)g[t.grupo]++});return g}

function sidebar(){
  var h='';
  RES.contratistas.forEach(function(c,i){var g=counts(c);
    h+='<button class="ci'+(i===IDX?' on':'')+'" onclick="pick('+i+')"><div class="cn">'+esc(titleName(c.nombre))+'</div><div class="cm"><span>'+(c.error?'sin HC':fmt(c.precioTipo)+' / folio')+'</span><span class="sem">'+
       '<i style="background:var(--red)"></i>'+g.r+' <i style="background:var(--amb);margin-left:4px"></i>'+g.a+' <i style="background:var(--qg);margin-left:4px"></i>'+g.g+'</span></div></button>'});
  $('clist').innerHTML=h;
}

function render(){
  sidebar();
  var c=cur(); window.scrollTo(0,0);
  var mk=RES.monthKey, mesN=MESES[+mk.slice(5,7)-1], corteD=+c.corte.slice(8,10);
  var h='<div class="pg"><div class="pg-h"><div class="ey">Avance de '+mesN+' '+mk.slice(0,4)+' · datos al '+corteD+' de '+mesN+'</div><h1>'+esc(titleName(c.nombre))+'</h1>';
  if(c.error){$('view').innerHTML=h+'</div><div class="err">'+c.error+'. Agrega su HC en el código.</div></div>';return}
  var vac=c.vacantes;
  h+='<div class="meta"><span>HC autorizado: <b>'+c.hc+' cuadrillas</b></span><span>Trabajando: <b class="'+(vac?'bad':'')+'">'+c.activos+' de '+c.hc+'</b></span><span>'+(c.tipoPrincipal==='LM'?'Tabla López Mateos':'Distritos Tipo '+c.tipoPrincipal)+'</span><span>Faltan <b>'+c.restH+' días</b> hábiles</span></div></div>';
  // 1. dinero + 2. precio
  var normal=c.precioTipo-c.adjAsist-c.adjProd, aP=c.proy.asistReal, pP=c.proy.prodReal;
  function adj(n){return n>0?'+$'+n:n<0?'−$'+(-n):'$0'}
  function bar(v,max,goal,ok){return '<div class="bar"><i style="width:'+Math.min(100,v/max*100)+'%;background:'+(ok?'var(--qg)':'var(--red)')+'"></i><u style="left:'+(goal/max*100)+'%"></u></div>'}
  h+='<div class="hero"><div class="c-money"><div><div class="l">Así vas al '+corteD+' de '+mesN+'</div><div class="v">'+fmt(c.cobrado)+'<sup>*</sup></div>'+
     '<div class="s">Estimado al cierre del mes, al ritmo actual: <b>'+fmt(c.cierre)+'</b>*</div>'+(c.pasH<7?'<div class="early">Pocos días de datos: puede cambiar mucho.</div>':'')+'</div>'+
     '<div class="n">* Antes de descuentos. No es un monto oficial ni garantizado.</div></div>';
  h+='<div class="c-price"><div class="top"><span class="l">Precio por folio</span><span class="v">'+fmt(c.precioTipo)+'</span></div><div class="nrm" style="text-align:right">precio normal '+fmt(normal)+'</div><div class="why">'+
     '<div class="w"><div class="t">Días trabajados<span>'+aP.toFixed(1)+' por cuadrilla · meta 25</span></div><div class="a '+(c.adjAsist<0?'dn':'z')+'">'+adj(c.adjAsist)+'</div>'+bar(aP,26,25,c.adjAsist>=0)+'</div>'+
     '<div class="w"><div class="t">Folios al día<span>'+pP.toFixed(1)+' por cuadrilla · meta 3.5</span></div><div class="a '+(c.adjProd>0?'up':'z')+'">'+adj(c.adjProd)+'</div>'+bar(pP,5,3.5,pP>=3.5)+'</div>'+
     '</div><span class="lnk" onclick="openRules()">¿Cómo se calcula? Ver reglas →</span></div></div>';
  // 3. acciones
  var G={r:[],a:[],g:[]}; c.tecs.forEach(function(t,i){t._i=i;G[t.grupo].push(t)});
  var st=[
    {ok:!vac,v:c.activos+' de '+c.hc,t:'Cuadrillas trabajando',s:vac?(vac+' lugar'+(vac>1?'es':'')+' de tu HC autorizado sin cubrir.'):'Tu HC autorizado está completo.'},
    {ok:c.adjAsist>=0,v:aP.toFixed(1)+' días',t:'Días por cuadrilla',s:c.adjAsist>=0?'Meta: 25 días por cuadrilla.':'Meta: 25 días completos por cuadrilla. Hoy cuenta como '+c.proy.asist+'.'},
    {ok:c.proy.prod>=3.5,v:pP.toFixed(1)+' folios',t:'Folios al día',s:'Meta: 3.5 folios al día por cuadrilla.'}];
  h+='<div class="blk"><div class="blk-h"><span class="t">Cómo vas contra tu meta</span><span class="s">estimado al cierre del mes</span></div><div class="acts3">';
  st.forEach(function(a){h+='<div class="ac'+(a.ok?' ok':' warn')+'"><div class="g">'+(a.ok?'✓ ':'')+a.v+'</div><b>'+a.t+'</b><span>'+a.s+'</span></div>'});
  h+='</div></div>';
  // 4. técnicos
  G.r.sort(function(a,b){return a.d-b.d});G.a.sort(function(a,b){return a.dProj-b.dProj});G.g.sort(function(a,b){return b.prodT-a.prodT});
  function row(t,msg){return '<button class="pr" onclick="openTec('+t._i+')"><div><div class="nm">'+esc(titleName(t.nombre))+'</div><div class="ms">'+msg+'</div></div><div class="dd">'+t.d+'<small>días</small></div></button>'}
  h+='<div class="blk"><div class="blk-h"><span class="t">Su equipo</span><span class="s">Clic en un técnico para ver su detalle</span></div><div class="cols">';
  h+='<div class="col r"><div class="col-h"><span class="d"></span><span class="t">Debajo de la meta</span><span class="n">'+(G.r.length+vac)+'</span></div><div class="col-s">No alcanzan 25 días este mes.</div>';
  if(vac)h+='<div class="pr vac"><div><div class="nm">'+vac+' lugar'+(vac>1?'es':'')+' vacío'+(vac>1?'s':'')+'</div><div class="ms">Cuenta'+(vac>1?'n':'')+' como 0 días</div></div><div class="dd">0<small>días</small></div></div>';
  G.r.forEach(function(t){h+=row(t,'Máximo llega a '+Math.round(t.maxPos)+' días')});
  if(!G.r.length&&!vac)h+='<div class="emp">Nadie 👏</div>';
  h+='</div><div class="col a"><div class="col-h"><span class="d"></span><span class="t">Cerca de la meta</span><span class="n">'+G.a.length+'</span></div><div class="col-s">Pueden llegar a la meta si mantienen el ritmo.</div>';
  G.a.forEach(function(t){h+=row(t,t.dProj<24.5?'Necesita trabajar todos los días que quedan':'Le faltan '+t.faltaFolSem+' folios por semana para 3.5 al día')});
  if(!G.a.length)h+='<div class="emp">Nadie</div>';
  h+='</div><div class="col g"><div class="col-h"><span class="d"></span><span class="t">En meta</span><span class="n">'+G.g.length+'</span></div><div class="col-s">En meta de días y folios.</div>';
  G.g.forEach(function(t){h+=row(t,t.prodT.toFixed(1)+' folios al día')});
  if(!G.g.length)h+='<div class="emp">Nadie todavía</div>';
  h+='</div></div></div>';
  h+='<div class="foot">QiORA Conecta · Documento informativo, no oficial. * Montos estimados antes de descuentos, sujetos a cambios y no garantizados. El pago final lo confirma QiORA Conecta.</div></div>';
  $('view').innerHTML=h;
}

function openTec(i){
  var c=cur(), t=c.tecs[i], mk=RES.monthKey, y=+mk.slice(0,4), m=+mk.slice(5,7)-1;
  var fest=Calc.FESTIVOS.filter(function(f){return f.slice(0,7)===mk});
  var cls=t.grupo==='g'?'good':t.grupo==='a'?'mid':'bad';
  var h='<div class="mh"><div><div class="t">'+esc(titleName(t.nombre))+'</div><div class="st">'+esc(t.u)+' · '+esc(titleName(t.sucursal.replace(/^CTA-TPI-INT-[A-Z]+\s*/,'')))+' · '+(t.tipo==='LM'?'López Mateos':'Tipo '+t.tipo)+'</div></div><button class="x" onclick="closeMo()">✕</button></div><div class="mb">';
  h+='<div class="kp">'+
     '<div class="k '+cls+'"><div class="l">Días trabajados</div><div class="v">'+t.d+'</div><div class="s">va a llegar a '+Math.round(t.dProj)+' · meta 25</div></div>'+
     '<div class="k '+(t.prodT>=3.5?'good':'bad')+'"><div class="l">Folios al día</div><div class="v">'+t.prodT.toFixed(1)+'</div><div class="s">proyectado · meta 3.5</div></div>'+
     '<div class="k"><div class="l">Folios</div><div class="v">'+(t.fol+t.fest)+'</div><div class="s">'+t.fpd.toFixed(1)+' por día que trabajó</div></div>'+
     '<div class="k"><div class="l">Lleva cobrado*</div><div class="v">'+fmt(t.pago)+'</div><div class="s">cierre aprox. '+fmt(t.pagoProj)+'</div></div></div>';
  // tipos
  var tipos=Object.keys(t.porTipo).sort(function(a,b){return t.porTipo[b]-t.porTipo[a]}), tot=0; tipos.forEach(function(k){tot+=t.porTipo[k]});
  h+='<div class="two"><div><div class="h4">Folios por tipo</div><table class="tt">';
  tipos.forEach(function(k){var n=t.porTipo[k];var pr=k==='Recoleccion'?Calc.P.reco:k==='Soporte'?t.precio-Calc.P.soporte:t.precio;
    h+='<tr><td>'+esc(k)+'<div class="bar"><i style="width:'+Math.round(n/tot*100)+'%"></i></div></td><td class="r">'+n+'</td><td class="r" style="color:var(--g5);font-weight:500">'+fmt(pr)+' c/u</td></tr>'});
  h+='<tr class="tot"><td>Total</td><td class="r">'+tot+'</td><td></td></tr></table></div>';
  // calendario
  var last=new Date(y,m+1,0).getDate(), first=(new Date(y,m,1).getDay()+6)%7, corte=c.corte;
  h+='<div><div class="h4">Folios por día</div><div class="cal">';
  ['L','M','M','J','V','S','D'].forEach(function(d){h+='<div class="wd">'+d+'</div>'});
  for(var e=0;e<first;e++)h+='<div class="c empty"></div>';
  for(var d=1;d<=last;d++){var key=mk+'-'+String(d).padStart(2,'0'), dow=new Date(y,m,d).getDay(), n=t.porDia[key]||0;
    var k='c';
    if(key>corte)k+=' fut';else if(dow===0&&!n)k+=' sun';else k+=n===0?' f0':n<3?' f1':n<4?' f2':' f3';
    if(fest.indexOf(key)>=0)k+=' fest';
    h+='<div class="'+k+'"><b>'+(key>corte?'':(dow===0&&!n?'':n))+'</b>'+d+'</div>'}
  h+='</div><div class="leg"><span><i style="background:var(--red-lt)"></i>no trabajó</span><span><i style="background:#fbeccf"></i>1–2</span><span><i style="background:var(--qg-md)"></i>3</span><span><i style="background:var(--qg)"></i>4 o más</span>'+(fest.length?'<span><i style="outline:2px solid var(--amb)"></i>día festivo</span>':'')+'</div></div></div>';
  var note=t.grupo==='r'?['r','<b>No va a llegar a 25 días.</b> Lleva '+t.d+' días y aunque trabaje los '+c.restH+' que quedan llega a '+Math.round(t.maxPos)+'. Esta cuadrilla le baja el promedio a todo el contratista.']
          :t.grupo==='a'?['a',t.dProj<24.5?'<b>Puede llegar.</b> Si no falta ningún día más llega a '+Math.round(t.maxPos)+' días.':'<b>Puede llegar.</b> Viene diario; le faltan unos '+t.faltaFolSem+' folios más por semana para llegar a 3.5 al día.']
          :['g','<b>Va muy bien.</b> Está en la meta de días y de folios. ¡Que siga así!'];
  h+='<div class="note '+note[0]+'">'+note[1]+'</div>';
  h+='<div class="how" style="margin-top:12px">* Antes de descuentos. Montos estimados, no oficiales ni garantizados.</div></div>';
  openMo(h);
}

function priceTable(tipo,me){
  var adj=tipo==='LM'?50:tipo==='B'?-40:0, cols=[3.3,3.4,3.5,3.6,3.7,3.8], rows=[26,25,24,23];
  var h='<table class="pt"><tr><th style="background:transparent;color:var(--g5)">Días</th>';
  cols.forEach(function(c){h+='<th>'+(c===3.8?'3.8+':c)+(c===3.5?' meta':'')+'</th>'});h+='</tr>';
  rows.forEach(function(r){h+='<tr><td>'+(r===23?'23 o menos':r+' días')+'</td>';
    cols.forEach(function(c){var p=Calc.precioA(r,c)+adj, base=480+adj;
      var k=p<base?'lo':p>=base+40?'b2':p>base?'b1':'';
      if(me&&Math.min(26,Math.max(23,me.asist))===r&&Math.min(3.8,Math.max(3.3,me.prod))===c)k+=' me';
      h+='<td class="'+k+'">$'+p+'</td>'});h+='</tr>'});
  return h+'</table>';
}
var RT='A';
function openRules(){
  var c=RES&&cur(); var me=c&&c.proy?{asist:c.proy.asist,prod:Math.round(Math.min(3.8,c.proy.prod)*10)/10}:null;
  if(c&&c.tipoPrincipal)RT=c.tipoPrincipal;
  var h='<div class="mh"><div><div class="t">Reglas del esquema</div><div class="st">Destajo con póliza · vigente desde septiembre 2026 · fijo por 3 meses</div></div><button class="x" onclick="closeMo()">✕</button></div><div class="mb"><div class="rules">';
  h+='<div class="rc" style="grid-column:1/-1"><b class="h">1. Tu póliza (tu meta del mes)</b><div class="formula"><div>HC<span>cuadrillas autorizadas</span></div>×<div>3.5<span>folios al día</span></div>×<div>26<span>días</span></div>=<div style="color:var(--qg)">91<span>folios por cuadrilla</span></div></div><p>Se te sigue pagando cada folio. La póliza es tu meta, no un tope. Todo se mide sobre tus cuadrillas <b>autorizadas</b>: si una no trabaja, cuenta como 0 días y 0 folios.</p></div>';
  h+='<div class="rc"><b class="h">2. Lo que sube tu precio</b><ul><li>Por cada <b>0.1 folios al día</b> arriba de 3.5, tu precio sube <b>$20</b>.</li><li>Tener tus cuadrillas autorizadas completas y trabajando.</li></ul></div>';
  h+='<div class="rc"><b class="h">3. Lo que baja tu precio</b><ul><li>Meta: <b>25 días</b> por cuadrilla.</li><li>Con 24 días: <b>−$15</b>. Con 23 o menos: <b>−$30</b>.</li><li>Lugares vacíos cuentan como 0 días.</li></ul></div>';
  h+='<div class="rc" style="grid-column:1/-1"><b class="h">4. Tu tabla de precio por folio</b><div class="tabs">'+['A','B','LM'].map(function(t){return '<button class="'+(t===RT?'on':'')+'" onclick="RT=\''+t+'\';openRules()">'+(t==='LM'?'López Mateos':'Tipo '+t)+'</button>'}).join('')+'</div>'+
     '<p style="font-size:13px;color:var(--g5)">Tipo A: GDL Barranca, Estadio y Primavera · Tipo B: resto de distritos · López Mateos: tabla propia.'+(me&&RT===c.tipoPrincipal?' <b style="color:var(--amb-dk)">Recuadro amarillo = donde vas este mes.</b>':'')+'</p>'+priceTable(RT,RT===(c&&c.tipoPrincipal)?me:null)+'</div>';
  h+='<div class="rc"><b class="h">5. Soporte y recolección</b><ul><li>Soporte: <b>$40 menos</b> que tu precio del mes.</li><li>Recolección: siempre <b>$150</b>.</li></ul></div>';
  h+='<div class="rc"><b class="h">6. Día festivo</b><ul><li>Cada folio se paga a tu precio, sin descuento de soporte.</li><li>Con <b>3 folios o más</b> ese día: bono de <b>$350</b>.</li></ul></div>';
  h+='<div class="rc" style="grid-column:1/-1"><b class="h">7. Importante</b><ul><li>El esquema queda fijo por <b>3 meses</b> y se revisa cada trimestre.</li><li>Esta pantalla es un <b>pronóstico</b>: usa lo que llevas en el mes y supone que sigues al mismo ritmo.</li><li>Los montos son <b>antes de descuentos</b> (material, uniformes, préstamos, arrendamiento, etc.), no son oficiales ni garantizados. Tu pago final te lo confirma QiORA Conecta en tu estado de cuenta.</li></ul></div>';
  h+='</div></div>';
  openMo(h);
}
</script><script>document.querySelectorAll("img[data-logo]").forEach(function(i){i.src=LOGO})</script></body></html>
